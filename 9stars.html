<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>九星</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@300;400&family=Cormorant+Infant:ital,wght@0,300;1,300&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@200;300&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <link rel="stylesheet" href="9stars.css" />
</head>
<body>

  <!-- PASSWORD GATE -->
  <div id="gate">
    <div class="gate-glyph">九星</div>
    <div class="gate-input-wrap">
      <input
        type="password"
        id="passInput"
        class="gate-input"
        placeholder="enter"
        autofocus
        autocomplete="off"
      />
    </div>
    <p class="gate-error" id="gateError">&nbsp;</p>
    <p class="gate-hint">press enter</p>
  </div>

  <!-- JYOTISH APP (hidden until authenticated) -->
  <div id="app-root"></div>

  <script src="9stars.js"></script>

  <!-- JYOTISH COMPONENT (transpiled in-browser via Babel) -->
  <script type="text/babel" src="9stars-app.jsx"></script>
</body>
</html>
